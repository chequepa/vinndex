name: Sommelier (Claude)

# Recorre el catálogo con Claude, bodega por bodega, para decidir qué vino
# es cada ficha (scripts/sommelier.mjs, scripts/lib-sommelier.mjs). Usa la
# Message Batches API: cada corrida junta el batch anterior si terminó y
# manda el siguiente, hasta el tope de gasto del ciclo. El daily-scrape
# aplica los veredictos en build-groups-v2.mjs.
#
# Configuración (Settings → Secrets and variables → Actions):
#   secret   ANTHROPIC_API_KEY      clave de la organización de Console que
#                                   recibe los créditos mensuales del plan
#   variable SOMMELIER_BUDGET_USD   tope por ciclo (default 90)
#   variable SOMMELIER_CYCLE_DAY    día del mes en que se renuevan los créditos

on:
  schedule:
    # Cada hora, en el minuto 23 (fuera del pico de las :00). Un batch
    # tarda de minutos a 24 h; cada corrida sólo junta y manda (si el batch
    # anterior sigue procesando, sale en segundos). Los créditos del plan
    # vencen al cerrar el ciclo: la vuelta completa (~4.100 pedidos) tiene
    # que entrar en días, no en semanas.
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sommelier
  cancel-in-progress: false

jobs:
  sommelier:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Casos dorados del sommelier (bloqueante)
        run: node scripts/test-sommelier.mjs

      - name: Juntar resultados + mandar el próximo batch
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SOMMELIER_BUDGET_USD: ${{ vars.SOMMELIER_BUDGET_USD }}
          SOMMELIER_CYCLE_DAY: ${{ vars.SOMMELIER_CYCLE_DAY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "Sin ANTHROPIC_API_KEY: el sommelier no corre."
            exit 0
          fi
          node scripts/sommelier.mjs run
          node scripts/sommelier.mjs status

      - name: Commit + push si cambió
        run: |
          git add -A data/sommelier
          if git diff --staged --quiet; then
            echo "sin cambios"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sommelier (Claude) — veredictos

          Auto-generated by .github/workflows/sommelier.yml.

          Co-Authored-By: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          # El daily-scrape también pushea a main: rebase y reintento.
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main || { echo "rebase failed"; exit 1; }
            if git push origin HEAD:main; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            sleep 5
          done
          echo "all push attempts failed"
          exit 1
