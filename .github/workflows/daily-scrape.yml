name: Daily scrape

on:
  # 06:00 UTC = 03:00 AR (UTC-3) — off-peak for most stores
  schedule:
    - cron: "0 6 * * *"
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

permissions:
  contents: write
  # `issues: write` permite que el step de healthcheck abra/comente
  # un issue cuando algún scraper rompe (label "scrape-failure").
  issues: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Scrape Tiendanube (14 stores)
        run: node scripts/scrape-tiendanube.mjs full
        continue-on-error: true

      - name: Scrape WooCommerce (8 stores)
        run: node scripts/scrape-woocommerce.mjs
        continue-on-error: true

      - name: Scrape VTEX (6 supermarkets)
        run: node scripts/scrape-vtex.mjs
        continue-on-error: true

      - name: Scrape Shopify (1 store)
        run: node scripts/scrape-shopify.mjs
        continue-on-error: true

      - name: Scrape Mercado Libre (listing pages)
        run: node scripts/scrape-mercadolibre.mjs
        continue-on-error: true

      - name: Enrich ML catalog (brand, varietal, EAN)
        env:
          ML_APP_ID: ${{ secrets.ML_APP_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_REFRESH_TOKEN: ${{ secrets.ML_REFRESH_TOKEN }}
        run: node scripts/enrich-ml-catalog.mjs
        continue-on-error: true

      - name: Scrape Magento (Ligier)
        run: node scripts/scrape-magento.mjs
        continue-on-error: true

      - name: Scrape PrestaShop (Frappe)
        run: node scripts/scrape-prestashop.mjs
        continue-on-error: true

      - name: Scrape Ambar Selecto (custom Supabase)
        run: node scripts/scrape-ambar.mjs
        continue-on-error: true

      - name: Merge snapshots
        run: node scripts/merge-snapshots.mjs

      # ── IDENTIDAD V2 (cutover 2026-07-03) ──────────────────────────────
      # Reemplaza a build-groups + Stages 1.5/2/3/4/5/6/6.5. Diseño en
      # docs/identity-v2.md. El harness dorado corre PRIMERO y es
      # bloqueante: si un caso conocido falla, el job muere acá y NO se
      # commitea nada (el sitio queda con el snapshot de ayer — mejor
      # datos viejos que quimeras nuevas).
      - name: Harness dorado (bloqueante)
        run: node scripts/test-matching.mjs

      # Catálogo incremental: sólo los candidatos NUEVOS van al LLM
      # (cache committeado en data/catalog-llm-cache.json). Si falla o no
      # hay key, se agrupa con el catálogo committeado del último run.
      - name: Identidad v2 — catálogo incremental
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            node scripts/build-wine-catalog.mjs
          else
            echo "Skipping catálogo — OPENAI_API_KEY not set (se usa el committeado)"
          fi
        continue-on-error: true

      # Publica: data/snapshot.json (con metadata de stores preservada) +
      # data/wine-slugs.json (URLs estables) + data/group-merges.json
      # (redirects 308). BLOQUEANTE: si falla, el job muere antes del
      # commit y el sitio conserva el snapshot anterior.
      - name: Identidad v2 — agrupación + publish
        run: node scripts/build-groups-v2.mjs --publish

      # Los redirects 308 son el SEO de las URLs viejas y se fueron
      # borrando solos durante un mes sin que nadie lo viera (13.494 el
      # 29/07 → 10.018 el 27/08). El mapa ahora es acumulativo; este test
      # es el que avisa si vuelve a encoger. BLOQUEANTE, misma doctrina
      # que el harness: mejor el snapshot de ayer que romper 3.500 URLs.
      - name: Invariantes de redirects (bloqueante)
        run: node scripts/test-redirects.mjs

      # Las preguntas "¿es el mismo vino?" salen de los pares que
      # comparten EAN pero los gates separaron, y ESO cambia con cada
      # snapshot: fichas que se fusionan, se parten o desaparecen. Sin
      # regenerar, el archivo se congela y termina preguntando por fichas
      # que ya no existen (10% del archivo en 11 días, medido el 09/08).
      # Va después del publish porque lee el snapshot recién agrupado.
      - name: Regenerar preguntas "¿es el mismo vino?"
        run: node scripts/build-match-questions.mjs --write
        continue-on-error: true

      - name: Find duplicates report (alimenta /admin/duplicates)
        run: node scripts/find-duplicates.mjs --out=data/duplicates-report.json
        continue-on-error: true

      - name: Generate vs-pairs (alimenta /vs/[slug])
        run: node scripts/generate-vs-pairs.mjs
        continue-on-error: true

      - name: Track prices (30-day rolling history)
        run: node scripts/track-prices.mjs
        continue-on-error: true

      - name: Detect price drops (alimenta /admin/price-drops + home)
        run: node scripts/detect-price-drops.mjs
        continue-on-error: true

      - name: Healthcheck del snapshot
        id: healthcheck
        run: |
          node scripts/scrape-healthcheck.mjs --json > /tmp/healthcheck.json || true
          # Si el script tira exit=1 (errores serios) lo capturamos en
          # el output del step para gatear el siguiente paso.
          node scripts/scrape-healthcheck.mjs > /tmp/healthcheck.txt
          STATUS=$?
          echo "ok=$([ $STATUS -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          cat /tmp/healthcheck.txt
        continue-on-error: true

      - name: Open GitHub issue si el healthcheck falla
        if: steps.healthcheck.outputs.ok == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Idempotente: si el label no existe, lo creamos. gh exit=1
          # cuando ya existe, así que swallow.
          gh label create "scrape-failure" --color "d93f0b" \
            --description "Daily scrape healthcheck detectó un problema" || true

          # Construimos el body del issue. Inline el healthcheck.txt
          # para que el equipo vea el detalle sin abrir el run.
          HC=$(cat /tmp/healthcheck.txt)
          BODY="El healthcheck del daily-scrape detectó issues serios.

          \`\`\`
          ${HC}
          \`\`\`

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Para resolver: chequear el log del run, identificar qué scraper se rompió (típicamente cambios en el HTML/JSON del CDN destino) y actualizar el adapter."

          # Reusa el issue abierto con label "scrape-failure" si existe;
          # sino crea uno nuevo. Evita spam (1 issue, N comments).
          EXISTING=$(gh issue list --label "scrape-failure" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create \
              --title "Daily scrape: healthcheck falló ($(date -u +%Y-%m-%d))" \
              --label "scrape-failure" \
              --body "$BODY"
          fi
        continue-on-error: true

      - name: Stats
        run: |
          node -e "
            const s = JSON.parse(require('fs').readFileSync('data/snapshot.json', 'utf8'));
            console.log('Stores:', s.storeCount);
            console.log('Products:', s.productCount);
            console.log('Groups:', s.groupCount);
            console.log('Multi-store groups:', s.multiStoreGroupCount);
          "

      - name: Check for changes
        id: diff
        run: |
          git add data/snapshot.json data/price-history.json data/duplicates-report.json data/price-drops.json data/vs-pairs.json data/group-merges.json
          # Artefactos de identidad v2 — el registro de slugs y el catálogo
          # son estado persistente del sistema; agregamos sólo los presentes.
          for f in data/wine-catalog.json data/catalog-llm-cache.json data/identity-v2-report.json data/wine-slugs.json data/match-questions.json; do
            [ -f "$f" ] && git add "$f" || true
          done
          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit + push if changed
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh snapshot (daily scrape)

          Auto-generated by .github/workflows/daily-scrape.yml.

          Co-Authored-By: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          # Si main cambió mientras corríamos (PRs mergeados), rebase y
          # reintentar push. Sin esto, el run fallaba con "non-fast-forward".
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main || { echo "rebase failed"; exit 1; }
            if git push origin HEAD:main; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push attempt $attempt failed, retrying"
            sleep 5
          done
          echo "all push attempts failed"
          exit 1
