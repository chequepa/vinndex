name: Fichas de bodega (Claude)

# Escribe una ficha corta y con fuentes para cada /bodega/[slug] con Claude +
# búsqueda web (scripts/bodega-notes.mjs → data/bodega-notes.json). Es
# incremental: cada corrida hace hasta BODEGA_NOTES_MAX bodegas nuevas o
# hasta BODEGA_NOTES_RUN_USD de gasto, lo que llegue primero. Con 1.147
# bodegas y los defaults (40 por día, US$5) termina en ~1 mes; después sólo
# corre para bodegas nuevas y reintentos de las que no tenían datos.
#
# Configuración (Settings → Secrets and variables → Actions):
#   secret   ANTHROPIC_API_KEY      la misma del sommelier
#   variable BODEGA_NOTES_MAX       bodegas por corrida (default 40)
#   variable BODEGA_NOTES_RUN_USD   tope de gasto por corrida (default 5)

on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:
    inputs:
      max:
        description: "Bodegas máximas en esta corrida (vacío = 40)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: bodega-notes
  cancel-in-progress: false

jobs:
  notes:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Salvaguardas de las fichas (bloqueante)
        run: node scripts/test-bodega-notes.mjs

      - name: Escribir fichas nuevas
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BODEGA_NOTES_MAX: ${{ inputs.max || vars.BODEGA_NOTES_MAX }}
          BODEGA_NOTES_RUN_USD: ${{ vars.BODEGA_NOTES_RUN_USD }}
        run: node scripts/bodega-notes.mjs

      - name: Commit + push si cambió
        run: |
          git add data/bodega-notes.json
          if git diff --staged --quiet; then
            echo "sin cambios"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: fichas de bodega (Claude)

          Auto-generated by .github/workflows/bodega-notes.yml.

          Co-Authored-By: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          # El daily-scrape y el sommelier también pushean a main.
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main || { echo "rebase failed"; exit 1; }
            if git push origin HEAD:main; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            sleep 5
          done
          echo "all push attempts failed"
          exit 1
